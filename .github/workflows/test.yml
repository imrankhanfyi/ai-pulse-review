name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Build source
        run: npx tsc

      - name: Build tests
        run: npx tsc -p tsconfig.test.json

      - name: Run tests
        run: node --test dist-test/test/**/*.test.js
